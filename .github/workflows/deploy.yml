name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on:  ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm Install

      - name: Lint & Build
        run: |
          npm run lint
          npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{  env.REGISTRY }}
          username: ${{ github.actor  }}
          password: ${{ secrets.GH_PAT }}
      
      - name: Build and Push Docker Image
        run: |
          # 이미지 이름을 소문자로 변환
          LOWER_IMAGE_NAME = $(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ${{ env.REGISTRY }}/$LOWER_IMAGE_NAME:latest .
          docker push ${{ env.REGISTRY }}/$LOWER_IMAGE_NAME:latest
      
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v.1.0.3
        with:
          host:  ${{ secrets.EC2_HOST}}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 변수설정
            LOWER_IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
              
            # GHCR 로그인 및 이미지 교체
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              
            # 프로젝트 폴더로 이동 (폴더가 없으면 생성)
            mkdir -p ~/app && cd ~/app
              
            # docker-compose.yml이 서버에 있다는 가정하에 실행
            docker compose pull
            docker compose up -d